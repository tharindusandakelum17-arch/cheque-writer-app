<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pro Banking Converter</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        /* Real Banking App Color Palette */
        :root {
            --bg-color: #f3f4f6; 
            --card-bg: #ffffff;
            --text-primary: #111827; 
            --text-secondary: #6b7280;
            --accent-blue: #1d4ed8; 
            --word-color: #111827; /* Dark color for light mode words */
            --border-color: #e5e7eb;
            --input-bg: #ffffff;
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            --radius-main: 20px;
        }

        /* Dark Mode - Pure Black Background */
        [data-theme="dark"] {
            --bg-color: #000000; /* Pure Black */
            --card-bg: #121212; /* Sleek dark card */
            --text-primary: #ffffff;
            --text-secondary: #94a3b8;
            --accent-blue: #3b82f6;
            --word-color: #ffffff; /* Pure White for words in dark mode */
            --border-color: #2d3748;
            --input-bg: #121212;
            --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Roboto', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            transition: background-color 0.3s ease;
        }

        .app-container {
            width: 100%;
            max-width: 400px; 
            background: var(--card-bg);
            border-radius: var(--radius-main);
            box-shadow: var(--shadow);
            padding: 32px 24px;
            position: relative;
            transition: background-color 0.3s ease;
        }

        /* Top Bar */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 35px;
        }

        .title-area h1 {
            font-size: 18px;
            font-weight: 700;
            color: var(--text-primary);
        }

        .title-area p {
            font-size: 11px;
            color: var(--text-secondary);
            margin-top: 2px;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .theme-btn {
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            width: 38px;
            height: 38px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            font-size: 16px;
            color: var(--text-primary);
            transition: 0.2s;
        }

        /* Input Section */
        .input-section {
            margin-bottom: 35px;
            text-align: center;
        }

        .currency-label {
            font-size: 12px;
            color: var(--text-secondary);
            font-weight: 600;
            margin-bottom: 4px;
            letter-spacing: 0.5px;
        }

        /* Number made slightly smaller & cleaner */
        input[type="number"] {
            width: 100%;
            background: transparent;
            border: none;
            border-bottom: 2px solid var(--border-color);
            color: var(--text-secondary); /* Less prominent color */
            font-size: 26px; 
            font-weight: 600;
            text-align: center;
            padding: 6px 0;
            outline: none;
            transition: border-color 0.2s, color 0.2s;
        }

        input[type="number"]:focus {
            border-bottom-color: var(--accent-blue);
            color: var(--text-primary);
        }

        /* Result Section - Made prominent */
        .result-section {
            background: var(--bg-color);
            border-radius: 16px;
            padding: 28px 20px;
            text-align: center;
            min-height: 140px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: background-color 0.3s ease;
        }

        /* Big, bold English Words */
        #wordOutput {
            font-size: 26px; 
            font-weight: 700;
            color: var(--word-color);
            line-height: 1.4;
            margin-bottom: 24px;
            word-wrap: break-word;
            width: 100%;
        }

        /* Premium Action Button */
        .action-btn {
            background: var(--accent-blue);
            color: #ffffff;
            border: none;
            border-radius: 12px;
            padding: 12px 24px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            transition: background-color 0.2s, transform 0.1s;
        }

        .action-btn:active {
            transform: scale(0.98);
        }

        /* Hide arrows in number input */
        input[type="number"]::-webkit-outer-spin-button,
        input[type="number"]::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
    </style>
</head>
<body>

<div class="app-container">
    <div class="top-bar">
        <div class="title-area">
            <h1>Cheque Writer</h1>
            <p>Word Converter</p>
        </div>
        <button class="theme-btn" id="themeToggle" onclick="toggleTheme()">🌙</button>
    </div>

    <div class="input-section">
        <div class="currency-label">AMOUNT (LKR)</div>
        <input type="number" id="amount" placeholder="Enter amount" oninput="convertToWords()">
    </div>

    <div class="result-section">
        <div id="wordOutput">Zero Only</div>
        <button class="action-btn" id="copyBtn" onclick="copyToClipboard()">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
                <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
            </svg>
            Copy Text
        </button>
    </div>
</div>

<script>
    function toggleTheme() {
        const body = document.documentElement;
        const btn = document.getElementById('themeToggle');
        
        if (body.getAttribute('data-theme') === 'dark') {
            body.removeAttribute('data-theme');
            btn.innerHTML = '🌙';
        } else {
            body.setAttribute('data-theme', 'dark');
            btn.innerHTML = '☀️';
        }
    }

    function numberToWords(num) {
        if (num === 0) return "Zero";
        
        const ones = ['', 'One', 'Two', 'Three', 'Four', 'Five', 'Six', 'Seven', 'Eight', 'Nine', 'Ten', 'Eleven', 'Twelve', 'Thirteen', 'Fourteen', 'Fifteen', 'Sixteen', 'Seventeen', 'Eighteen', 'Nineteen'];
        const tens = ['', '', 'Twenty', 'Thirty', 'Forty', 'Fifty', 'Sixty', 'Seventy', 'Eighty', 'Ninety'];
        
        function convertGroup(n) {
            if (n < 20) return ones[n];
            if (n < 100) return tens[Math.floor(n / 10)] + (n % 10 !== 0 ? ' ' + ones[n % 10] : '');
            return ones[Math.floor(n / 100)] + ' Hundred' + (n % 100 !== 0 ? ' and ' + convertGroup(n % 100) : '');
        }

        let words = '';
        if (Math.floor(num / 10000000) > 0) { words += convertGroup(Math.floor(num / 10000000)) + ' Crore '; num %= 10000000; }
        if (Math.floor(num / 100000) > 0) { words += convertGroup(Math.floor(num / 100000)) + ' Lakh '; num %= 100000; }
        if (Math.floor(num / 1000) > 0) { words += convertGroup(Math.floor(num / 1000)) + ' Thousand '; num %= 1000; }
        if (num > 0) { words += convertGroup(num); }
        
        return words.trim();
    }

    function convertToWords() {
        const inputVal = document.getElementById('amount').value;
        const outputDiv = document.getElementById('wordOutput');
        
        if (!inputVal || isNaN(inputVal) || inputVal <= 0) {
            outputDiv.innerText = "Zero Only";
            return;
        }

        const wholeNumber = parseInt(inputVal, 10);
        outputDiv.innerText = numberToWords(wholeNumber) + " Only";
    }

    function copyToClipboard() {
        const text = document.getElementById('wordOutput').innerText;
        navigator.clipboard.writeText(text);
        
        const btn = document.getElementById('copyBtn');
        const originalHTML = btn.innerHTML;
        
        btn.innerHTML = `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg> Copied!`;
        btn.style.backgroundColor = "#10b981"; 
        
        setTimeout(() => {
            btn.innerHTML = originalHTML;
            btn.style.backgroundColor = "var(--accent-blue)";
        }, 2000);
    }
</script>

</body>
</html>
